[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raycast-linux"
version = "1.0.0"
description = "Raycast-style launcher and productivity hub for Linux — native GTK4 frontend + Python API backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arena.ai" }]
keywords = ["launcher", "clipboard", "snippets", "gtk4", "productivity", "raycast"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
raycast-linux = "raycast_linux.cli:main"

[tool.setuptools.packages.find]
include = ["raycast_linux*"]

[tool.setuptools.package-data]
"raycast_linux.frontend" = ["*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
