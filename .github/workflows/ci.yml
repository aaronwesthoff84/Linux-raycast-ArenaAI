name: CI and Package Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-4.0 wl-clipboard python3-gi xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: |
          pytest tests/ -v

      - name: CLI smoke tests
        run: |
          python -m raycast_linux --help
          python -m raycast_linux env
          python -m raycast_linux doctor || true

  packaging:
    name: Package Build and Integrity Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build source package tarball and checksums
        run: |
          bash packaging/build-source.sh

      - name: Verify package tarball integrity
        run: |
          cd packaging
          sha256sum -c SHA256SUMS

      - name: Verify PKGBUILD syntax and metadata
        run: |
          test -f packaging/PKGBUILD
          grep -q "pkgname=raycast-linux" packaging/PKGBUILD
          grep -q "https://github.com/aaronwesthoff84/Linux-raycast-ArenaAI" packaging/PKGBUILD
          ! grep -q "example.invalid" packaging/PKGBUILD
          ! grep -q "python-venv" packaging/PKGBUILD

      - name: Test uninstall script safety
        run: |
          bash uninstall.sh --help
